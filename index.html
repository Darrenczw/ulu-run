<!doctype html>
<html lang="en-SG">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ulu Run</title>
<meta name="description" content="Running routes from your doorstep, in every Singapore neighbourhood. Built from the Park Connector Network.">
<meta name="theme-color" content="#F5F1E4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preload" href="fonts/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css">
<link rel="stylesheet" href="styles/app.css">
</head>
<body>
<div class="app" id="app" data-region="west" data-view="find">
  <div class="map-wrap">
    <div id="map" class="map" role="region" aria-label="Map of routes. Every route on the map is also in the list below."></div>
    <p class="credit" id="credit">
      <img src="https://www.onemap.gov.sg/web-assets/images/logo/om_logo.png" alt="" width="16" height="16">
      <a href="https://www.onemap.gov.sg/" target="_blank" rel="noopener noreferrer">OneMap</a>&nbsp;©&nbsp;contributors&nbsp;|&nbsp;<a href="https://www.sla.gov.sg/" target="_blank" rel="noopener noreferrer">Singapore Land Authority</a>
    </p>
    <p class="offline-note" id="offline-note" hidden>Offline. Street map hidden; route lines still shown.</p>
  </div>

  <section class="panel" id="panel" aria-label="Routes">
    <svg class="coast" id="coast" viewBox="0 0 390 36" preserveAspectRatio="none" aria-hidden="true"><path id="coast-path" d=""/></svg>
    <div class="panel-body" id="panel-body"></div>
  </section>

  <nav class="tabs" aria-label="Main">
    <a href="#/" class="tab" data-tab="find"><svg class="i" aria-hidden="true"><use href="#i-map"/></svg><span>Find</span></a>
    <a href="#/saved" class="tab" data-tab="saved"><svg class="i" aria-hidden="true"><use href="#i-bookmark"/></svg><span>Saved</span><b class="tab-count" id="saved-count" hidden></b></a>
    <a href="#/about" class="tab" data-tab="about"><svg class="i" aria-hidden="true"><use href="#i-info"/></svg><span>About</span></a>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<dialog class="search" id="search" aria-label="Choose a start point">
  <form class="search-bar" method="dialog" id="search-form">
    <button class="icon-btn" value="cancel" aria-label="Close search"><svg class="i" aria-hidden="true"><use href="#i-arrow-left"/></svg></button>
    <label class="search-field">
      <span class="visually-hidden">Start near</span>
      <svg class="i" aria-hidden="true"><use href="#i-search"/></svg>
      <input id="search-input" type="search" placeholder="Station, code or town" autocomplete="off" autocapitalize="words" enterkeyhint="go" spellcheck="false">
    </label>
  </form>
  <button class="locate-row" id="locate-row" type="button">
    <span class="locate-dot"><svg class="i" aria-hidden="true"><use href="#i-locate"/></svg></span>
    <span><b>Use my location</b><small id="locate-msg">Your location stays on this phone.</small></span>
  </button>
  <ul class="search-results" id="search-results" role="listbox" aria-label="Start points"></ul>
</dialog>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-map" viewBox="0 0 24 24"><path d="M14.1 5.55a2 2 0 0 0 1.79 0l3.66-1.83A1 1 0 0 1 21 4.62v12.76a1 1 0 0 1-.55.9l-4.56 2.27a2 2 0 0 1-1.79 0l-4.2-2.1a2 2 0 0 0-1.8 0l-3.65 1.83A1 1 0 0 1 3 19.38V6.62a1 1 0 0 1 .55-.9l4.56-2.27a2 2 0 0 1 1.79 0zM15 5.76v15M9 3.24v15"/></symbol>
    <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></symbol>
    <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7M19 12H5"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7.5"/><path d="m21 21-4.3-4.3"/></symbol>
    <symbol id="i-locate" viewBox="0 0 24 24"><path d="M2 12h3M19 12h3M12 2v3M12 19v3"/><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5"/></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/><path d="m18 2 4 4-4 4M2 6h1.9c1.5 0 2.9.9 3.6 2.2M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8M18 14l4 4-4 4"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-expand" viewBox="0 0 24 24"><path d="m18 15-6-6-6 6"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M20 10c0 4.99-5.54 10.19-7.4 11.8a1 1 0 0 1-1.2 0C9.54 20.19 4 14.99 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></symbol>
    <symbol id="i-flag" viewBox="0 0 24 24"><path d="M4 22V4a1 1 0 0 1 .4-.8A6 6 0 0 1 8 2c3 0 5 2 7.33 2q2 0 3.67-1.33a1 1 0 0 1 1.6.8v9.33a1 1 0 0 1-.4.8A6 6 0 0 1 16.33 14c-2.33 0-4.33-2-7.33-2-1.6 0-3 .6-4 1.33"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3M12 9v4M12 17h.01"/></symbol>
  </defs>
</svg>

<script src="vendor/maplibre/maplibre-gl.js"></script>
<script type="module" src="src/app.js"></script>
</body>
</html>
